<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Ventas</title>
  </head>
  <body>

    <header>
      <h1>Totalizador de Ventas</h1>
    </header>

    <main>
      <div class="form">
        <label>Cantidad de Item: </label>
        <input type="number" id="itemAmount">
        <label>Precio por Item: </label>
        <input type="number" id="itemPrice">
        <label>Código de Estado: </label>
        <input type="text" id="statusCode">
        <button>Totalizar</button>
      </div>

      <div class="summarize">
        <label>Precio neto ($): </label>
        <div id="netPrice">0</div>
        <label>Descuento (%): </label>
        <div id="discount">0</div>
        <label>Impuesto para TX (%): </label>
        <div id="taxes">0</div>
        <label>Precio Total ($): </label>
        <div id="total">0</div>
      </div>
    </main>

  </body>
</html>

<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Ventas</title>
    <style>
      .toast {
        background: #b42318;
        border-radius: 4px;
        color: white;
        display: none;
        padding: 12px 16px;
        position: fixed;
        right: 20px;
        top: 20px;
        z-index: 1;
      }

      .toast.visible {
        display: block;
      }

      .confirmacion {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 20px;
      }

      .confirmacion::backdrop {
        background: rgb(0 0 0 / 40%);
      }
    </style>
  </head>
  <body>

    <header>
      <h1>Totalizador de Ventas</h1>
    </header>

    <main>
      <div class="form">
        <label>Cantidad de Item: </label>
        <input type="number" id="itemAmount">
        <label>Precio por Item: </label>
        <input type="number" id="itemPrice">
        <label>Código de Estado: </label>
        <select id="statusCode">
          <option>UT</option>
          <option>NV</option>
          <option>TX</option>
          <option>AL</option>
          <option>CA</option>
        </select>
        <button>Totalizar</button>
      </div>

      <div class="summarize">
        <label>Precio neto ($): </label>
        <div id="netPrice"></div>
      </div>
    </main>

    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <dialog id="confirmacion-dialog" class="confirmacion">
      <h2>Confirmar compra</h2>
      <p>¿Desea confirmar la compra?</p>
      <button id="confirmar-compra" type="button">Confirmar</button>
      <button id="cancelar-compra" type="button">Cancelar</button>
    </dialog>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
